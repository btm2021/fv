<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>STAT2 Pro Trading Terminal | Multi-Exchange Futures (Binance, Bybit, OKX)</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.svg">

  <!-- Suppress 3rd party CDN console notices -->
  <script>
    (function() {
      const _warn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && (args[0].includes('cdn.tailwindcss.com') || args[0].includes('Babel transformer'))) {
          return;
        }
        _warn.apply(console, args);
      };
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            binance: {
              bg: '#090D16',
              panel: '#111726',
              subpanel: '#161F33',
              card: '#14181F',
              hover: '#1E293B',
              active: '#1E2329',
              border: '#1E293B',
              borderSubtle: '#182030',
              borderHighlight: '#334155',
              yellow: '#F0B90B',
              yellowHover: '#FCD535',
              green: '#10B981',
              greenBg: 'rgba(16, 185, 129, 0.12)',
              red: '#F43F5E',
              redBg: 'rgba(244, 63, 94, 0.12)',
              cyan: '#06B6D4',
              cyanBg: 'rgba(6, 182, 212, 0.12)',
              purple: '#A855F7',
              pink: '#D946EF',
              amber: '#F59E0B',
              text: '#F8FAFC',
              textSec: '#94A3B8',
              textMuted: '#64748B'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'IBM Plex Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="styles.css">

  <!-- Lightweight Charts Local + CDN Fallback -->
  <script src="/libs/lightweight-charts.standalone.production.js"></script>
  <script>
    if (typeof LightweightCharts === 'undefined') {
      document.write('<script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"><' + '/script>');
    }
  </script>

  <!-- React 18 Production Standalone -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Universal JavaScript SMC & STAT2 Indicators Suite -->
  <script src="/smc.js"></script>
  <script src="/indicators/registry.js"></script>
  <script src="/indicators/indicator_atrbot.js"></script>
  <script src="/indicators/indicator_stat2_box_strategy.js"></script>
  <script src="/indicators/indicator_smc.js"></script>
  <script src="/indicators/indicator_ema.js"></script>
  <script src="/indicators/indicator_vwap.js"></script>
</head>
<body class="bg-binance-bg text-binance-text font-sans antialiased overflow-hidden select-none h-screen w-screen">
  <div id="root" class="h-full w-full flex flex-col"></div>

  <!-- Pre-compiled Production React 18 Application Script -->
  <script src="app.js"></script>
</body>
</html>
