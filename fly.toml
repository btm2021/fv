# fly.toml app configuration file generated for fv-bv on 2026-08-25T10:22:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fv-bv'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  NODE_OPTIONS = '--max-old-space-size=192'
  PORT = '3000'

[[mounts]]
  source = 'trading_data'
  destination = '/app/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
