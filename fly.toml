# fly.toml app configuration file for 24/7 SMC Quantum Trading Hub
# Generated for single persistent machine deployment (24/7 background market scanner)

app = "quantum-smc-trading-hub"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "trading_data"
  destination = "/app/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
