# fly.toml app configuration file generated for quantum-smc-trading-hub on 2026-08-25T10:50:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "quantum-smc-trading-hub"
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  NODE_OPTIONS = "--max-old-space-size=192"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[mounts]
  source = "trading_data"
  destination = "/app/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  memory = '1gb'
  processes = ['app']
  size = 'shared-cpu-1x'
